<VirtualHost *:5000>
    ServerName depoe

    WSGIDaemonProcess astrologger processes=1 threads=15
    WSGIScriptAlias / /var/www/astrologger/astrologger.wsgi
    <Directory /var/www/astrologger>
        WSGIProcessGroup astrologger
        WSGIApplicationGroup %{GLOBAL}
        Order deny,allow
        Allow from all
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

