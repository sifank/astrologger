<VirtualHost *:5001>
    ServerName depoe

    WSGIDaemonProcess session processes=1 threads=15
    WSGIScriptAlias / /var/www/astrologger/session.wsgi

    <Directory /var/www/astrologger>
        WSGIProcessGroup session
        WSGIApplicationGroup %{GLOBAL}
        Order deny,allow
        Allow from all
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

