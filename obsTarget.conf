<VirtualHost *:5002>
    ServerName depoe

    WSGIDaemonProcess target processes=1 threads=15
    WSGIScriptAlias / /var/www/astrologger/target.wsgi

    <Directory /var/www/astrologger>
        WSGIProcessGroup target
        WSGIApplicationGroup %{GLOBAL}
        Order deny,allow
        Allow from all
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

