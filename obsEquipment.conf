<VirtualHost *:5003>
    ServerName depoe

    WSGIDaemonProcess equipment processes=1 threads=15
    WSGIScriptAlias / /var/www/astrologger/equipment.wsgi

    <Directory /var/www/astrologger>
        WSGIProcessGroup equipment
        WSGIApplicationGroup %{GLOBAL}
        Order deny,allow
        Allow from all
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

